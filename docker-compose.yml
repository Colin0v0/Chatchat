services:
  postgres:
    # 服务器也从显式镜像地址拉取 pgvector，国内部署建议转存到阿里云 ACR。
    platform: linux/amd64
    image: ${POSTGRES_IMAGE:?请设置 POSTGRES_IMAGE，例如 registry.cn-hangzhou.aliyuncs.com/命名空间/chatchat-pgvector:pg16}
    container_name: chatchat-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?请设置 POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?请设置 POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请设置 POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_HOST:?请设置 POSTGRES_HOST}:${POSTGRES_PORT:?请设置 POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?请设置 POSTGRES_USER} -d ${POSTGRES_DB:?请设置 POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    # 服务器也从显式镜像地址拉取 Redis，国内部署建议转存到阿里云 ACR。
    platform: linux/amd64
    image: ${REDIS_IMAGE:?请设置 REDIS_IMAGE，例如 registry.cn-hangzhou.aliyuncs.com/命名空间/chatchat-redis:7-alpine}
    container_name: chatchat-redis
    ports:
      - "${REDIS_HOST:?请设置 REDIS_HOST}:${REDIS_PORT:?请设置 REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    # 部署环境只拉取已经构建好的后端镜像，不在小服务器上执行 build。
    platform: linux/amd64
    image: ${BACKEND_IMAGE:?请设置 BACKEND_IMAGE，例如 registry.cn-hangzhou.aliyuncs.com/命名空间/chatchat-backend:latest}
    container_name: chatchat-backend
    env_file:
      - ./backend/.env
      - ./backend/.env.deploy.wsl
    environment:
      DATABASE_URL: ${BACKEND_DATABASE_URL:?请设置 BACKEND_DATABASE_URL}
      REDIS_URL: ${BACKEND_REDIS_URL:?请设置 BACKEND_REDIS_URL}
      AUDIO_TRANSCRIPTION_MODEL: ${AUDIO_TRANSCRIPTION_MODEL:?请设置 AUDIO_TRANSCRIPTION_MODEL}
    extra_hosts:
      - "host:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_HOST:?请设置 BACKEND_HOST}:${BACKEND_PORT:?请设置 BACKEND_PORT}:8000"
    volumes:
      - ${BACKEND_STORAGE_HOST_PATH:?请设置 BACKEND_STORAGE_HOST_PATH}:/app/storage
      - ./backend/.env.deploy.wsl:/app/.env.deploy.wsl:ro
      - pip-cache:/root/.cache/pip
    restart: unless-stopped

  frontend:
    # 部署环境只拉取已经构建好的前端镜像，不在小服务器上执行 build。
    platform: linux/amd64
    image: ${FRONTEND_IMAGE:?请设置 FRONTEND_IMAGE，例如 registry.cn-hangzhou.aliyuncs.com/命名空间/chatchat-frontend:latest}
    container_name: chatchat-frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_HOST:?请设置 FRONTEND_HOST}:${FRONTEND_PORT:?请设置 FRONTEND_PORT}:80"
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  pip-cache:
