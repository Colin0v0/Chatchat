services:
  postgres:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg16}
    container_name: chatchat-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chatchat}
      POSTGRES_USER: ${POSTGRES_USER:-chatchat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chatchat}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chatchat} -d ${POSTGRES_DB:-chatchat}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: chatchat-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      args:
        DOCKER_REGISTRY: ${DOCKER_REGISTRY:-docker.io}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    container_name: chatchat-backend
    env_file:
      - ./backend/.env
      - ./backend/.env.deploy.wsl
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://chatchat:chatchat@postgres:5432/chatchat}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-nomic-embed-text}
      RAG_TOP_K: ${RAG_TOP_K:-4}
      RAG_SECTION_MAX_CHARS: ${RAG_SECTION_MAX_CHARS:-1400}
      # 模型路径（容器内）
      IMAGE_VISION_MODEL: ${IMAGE_VISION_MODEL:-/models/Florence-2-base-ft}
      AUDIO_TRANSCRIPTION_MODEL: ${AUDIO_TRANSCRIPTION_MODEL:-/models/SenseVoiceSmall}
    extra_hosts:
      - "host:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    gpus: all
    volumes:
      - ${BACKEND_STORAGE_HOST_PATH:-./storage}:/app/storage
      - ./backend/.env.deploy.wsl:/app/.env.deploy.wsl:ro
      - ${MODELS_HOST_PATH:-./models}:/models:ro
      - pip-cache:/root/.cache/pip
      - huggingface-cache:/root/.cache/huggingface
      - modelscope-cache:/root/.cache/modelscope
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        DOCKER_REGISTRY: ${DOCKER_REGISTRY:-docker.io}
    container_name: chatchat-frontend
    depends_on:
      - backend
    ports:
      - "3300:80"
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  pip-cache:
  huggingface-cache:
  modelscope-cache:
