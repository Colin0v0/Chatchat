services:
  backend:
    build:
      context: ./backend
      args:
        DOCKER_REGISTRY: ${DOCKER_REGISTRY:-docker.io}
    container_name: chatchat-backend
    env_file:
      - ./backend/.env
      - ./backend/.env.deploy.wsl
    environment:
      RAG_VAULT_PATH: ${RAG_VAULT_PATH:-/data/obsidian}
      RAG_INDEX_PATH: ${RAG_INDEX_PATH:-/app/storage/rag/index.json}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-nomic-embed-text}
      RAG_TOP_K: ${RAG_TOP_K:-4}
      RAG_SECTION_MAX_CHARS: ${RAG_SECTION_MAX_CHARS:-1400}
      # 模型路径（容器内）
      IMAGE_VISION_MODEL: ${IMAGE_VISION_MODEL:-/models/Florence-2-base-ft}
      AUDIO_TRANSCRIPTION_MODEL: ${AUDIO_TRANSCRIPTION_MODEL:-/models/SenseVoiceSmall}
    extra_hosts:
      - "host:host-gateway"
    ports:
      - "8000:8000"
    gpus: all
    volumes:
      # 使用宿主机目录持久化后端数据（默认项目根目录 ./storage）
      - ${BACKEND_STORAGE_HOST_PATH:-./storage}:/app/storage
      # 让后端在容器内可读取 /app/.env.deploy.wsl（配置加载逻辑会校验该文件存在）
      - ./backend/.env.deploy.wsl:/app/.env.deploy.wsl:ro
      # Windows路径挂载到WSL2（/mnt/驱动器/路径）
      - ${OBSIDIAN_VAULT_HOST_PATH:-/mnt/e/360MoveData/Users/29220/Documents/COLIN_all_in_one_note}:/data/obsidian:ro
      # 项目内模型目录挂载（只读）
      - ${MODELS_HOST_PATH:-./models}:/models:ro
      # HuggingFace缓存目录（使用Docker卷持久化）
      - huggingface-cache:/root/.cache/huggingface
      - modelscope-cache:/root/.cache/modelscope
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        DOCKER_REGISTRY: ${DOCKER_REGISTRY:-docker.io}
    container_name: chatchat-frontend
    depends_on:
      - backend
    ports:
      - "3300:80"
    restart: unless-stopped

volumes:
  huggingface-cache:
  modelscope-cache:
